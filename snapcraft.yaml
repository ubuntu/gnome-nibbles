name: gnome-nibbles
adopt-info: gnome-nibbles
grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict
base: core24

layout:
  /usr/share/gnome-nibbles:
    bind: $SNAP/usr/share/gnome-nibbles

slots:
  # for GtkApplication registration
  gnome-nibbles:
    interface: dbus
    bus: session
    name: org.gnome.Nibbles

apps:
  gnome-nibbles:
    extensions: [gnome]
    command: usr/bin/gnome-nibbles
    plugs:
      - audio-playback
    desktop: usr/share/applications/org.gnome.Nibbles.desktop
    common-id: org.gnome.Nibbles.desktop
    environment:
      DISABLE_WAYLAND: 'true'

parts:
  gnome-nibbles:
    source: https://gitlab.gnome.org/GNOME/gnome-nibbles.git
    source-type: git
    source-tag: '4.2.2'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
    parse-info: [usr/share/metainfo/org.gnome.Nibbles.appdata.xml]
    build-packages:
      - libgnome-games-support-1-dev
    stage-packages:
      - libgnome-games-support-1-3
    override-pull: |
      craftctl default
      sed -i 's|Icon=org.gnome.Nibbles|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/org.gnome.Nibbles.svg|g' data/org.gnome.Nibbles.desktop.in
    prime:
      - usr/bin/gnome-nibbles
      - usr/share/applications/org.gnome.Nibbles.desktop
      - usr/share/glib-2.0/schemas/org.gnome.Nibbles.gschema.xml
      - usr/share/gnome-nibbles
      - usr/share/icons/hicolor
      - usr/share/metainfo/org.gnome.Nibbles.appdata.xml
      - usr/lib/*/libgnome-games-support*
